<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="color-scheme" content="light dark">
    <title>墨页 PDF 预览</title>
    <style>
      :root { background: #242424; color: #eee; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      #status { padding: 12px 16px; text-align: center; color: #c9cdd4; font-size: 13px; }
      /* One vertical column of pages: the document itself scrolls, so the note
         overlay can stay anchored to viewport coordinates. */
      #pages { padding: 0 18px 56px; }
      .pdf-page {
        --scale-round-x: 1px;
        --scale-round-y: 1px;
        position: relative;
        flex: none;
        margin: 0 auto 18px;
        background: white;
        box-shadow: 0 2px 14px #0008;
        overflow: hidden;
      }
      .pdf-page[data-rendered="false"] {
        background: #f7f8fa;
        box-shadow: 0 2px 12px #0006, inset 0 0 0 1px #00000010;
      }
      /* Compact reading: the host preference drops the gap between pages and
         keeps the page shadow, so consecutive pages touch. */
      html[data-pdf-compact] .pdf-page { margin-bottom: 0; }
      .page-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9aa4b2;
        font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0.14em;
        animation: page-placeholder-pulse 1.6s ease-in-out infinite;
      }
      .page-placeholder.error { color: #8c4540; animation: none; }
      @keyframes page-placeholder-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { .page-placeholder { animation: none; opacity: 0.7; } }
      .page-canvas { position: absolute; inset: 0; display: block; }
      .textLayer {
        --min-font-size: 1;
        --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
        --min-font-size-inv: calc(1 / var(--min-font-size));
        position: absolute;
        inset: 0;
        overflow: clip;
        line-height: 1;
        text-align: initial;
        text-size-adjust: none;
        -webkit-text-size-adjust: none;
        forced-color-adjust: none;
        transform-origin: 0 0;
        z-index: 1;
      }
      .textLayer :is(span, br) {
        position: absolute;
        color: transparent;
        white-space: pre;
        cursor: text;
        transform-origin: 0 0;
      }
      .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
        --font-height: 0;
        --scale-x: 1;
        --rotate: 0deg;
        z-index: 1;
        font-size: calc(var(--text-scale-factor) * var(--font-height));
        transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
      }
      .textLayer .markedContent { display: contents; }
      .textLayer ::selection { background: rgb(52 104 255 / 0.35); }
      [data-main-rotation="90"] { transform: rotate(90deg) translateY(-100%); }
      [data-main-rotation="180"] { transform: rotate(180deg) translate(-100%, -100%); }
      [data-main-rotation="270"] { transform: rotate(270deg) translateX(-100%); }
      .hiddenCanvasElement { position: absolute; inset: 0 auto auto 0; width: 0; height: 0; display: none; }
    </style>
  </head>
  <body>
    <div id="status" role="status">等待本地图书数据…</div>
    <main id="pages" aria-label="PDF 页面"></main>
    <script type="module" src="./viewer.mjs"></script>
  </body>
</html>
