[package]
name = "ngy-book-studio"
version = "0.1.0"
edition = "2024"
description = "A native Windows library, reader, editor, and AI workspace for books and documents"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
ammonia = "=4.1.4"
async-channel = "2.5"
base64 = "=0.22.1"
blake3 = "1.8"
# Pure-Rust DjVu decoder (MIT, no GPL code). `default` only enables `std`; the
# OCR/ONNX/rayon and export features stay off so the build stays portable.
djvu-rs = { version = "=0.32.1", default-features = false, features = ["std"] }
directories = "6.0"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
gpui = { version = "0.2.2", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { version = "0.5.1", features = ["webview"] }
gpui-component-assets = { version = "0.5.1" }
html5ever = "=0.27.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lopdf = { version = "=0.44.0", default-features = false }
# Keep chat sanitization on the same Markdown parser as gpui-component.
markdown = "=1.0.0"
mime_guess = "2.0"
markup5ever_rcdom = "=0.3.0"
native-dialog = { version = "0.9.7", features = ["windows_dpi_awareness", "windows_visual_styles"] }
object_store = { version = "=0.14.1", default-features = false, features = ["fs"] }
office_oxide = { version = "=0.1.9", default-features = false }
percent-encoding = "2.3"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
rbook = { version = "0.7.10", default-features = false, features = ["prelude", "threadsafe", "write"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
resvg = { version = "=0.45.1", default-features = false, features = ["system-fonts", "text"] }
urlencoding = "2.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.1.10-alpha.4's published crate omits sqlite-vec-diskann.c and cannot
# compile on Windows. 0.1.8 is the newest verified self-contained release.
sqlite-vec = "=0.1.8"
tempfile = "3.27"
tokio = { version = "=1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter-python = "=0.23.6"
zip = { version = "8.6", default-features = false }

# Deliberately pinned pre-v1 Kindle parser. Keep changes behind the Windows
# corpus and hostile-file gates documented in AGENTS.md.
ebook-rs = { version = "=0.16.4", default-features = false }
ngy-utils-tracing = "0.5.1"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
open = "5.4"
# Match Wry's pinned WebView2 bindings for the native reader selection menu.
webview2-com = "=0.38.2"
windows = { version = "0.61.3", features = [
    "Data_Pdf",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

# Debug info is dominated by third-party crates (aws-lc-sys, ring, rav1e,
# resvg, gpui...), which produced a ~640 MB PDB and a 21 GB target dir. Keep
# full debug info for this crate only; dependencies are rarely stepped into
# and rebuilding them with debuginfo costs disk and link time.
[profile.dev]
debug = 2

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
strip = true
