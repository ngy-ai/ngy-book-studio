name: Release

# tag 推送 → 构建 + 创建 Release；手动触发 → 只构建、留 artifact、不发 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 双保险：脚本自己也会 reconfigure，但 runner 的控制台代码页在脚本启动前就可能出事。
  PYTHONIOENCODING: utf-8
  # 磁盘：这个项目的 debug 产物在本机累积到 27GB，而 runner 只有十几 GB。
  # 去掉调试符号能砍掉一大半，且发布流程不需要它们。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # 唯一完整验收的平台，四个里只有它跑测试。
            test: true
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # 不跑测试：runner 装不下 release 与 debug 两份产物。
            # 这一条必须和 Release 说明里的「仅验证构建」对上，不要假装测过。
            test: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            test: false
          # macos-latest 本身是 arm64，x86_64 靠交叉。
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            test: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 必须在编译前腾地方：这个仓库一次完整构建远超 runner 的默认剩余空间。
      # 第一次跑（2026-09-24）四个平台全部倒在编译上，耗时 200s / 250s / 414s / 487s
      # —— 失败顺序正好等于各 runner 的磁盘紧张程度，就是写满了。
      - name: 腾磁盘
        shell: bash
        run: |
          echo "::group::清理前"
          df -h
          echo "::endgroup::"
          case "${{ runner.os }}" in
            Linux)
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                          /opt/hostedtoolcache/CodeQL /usr/local/share/boost
              ;;
            macOS)
              # 只删模拟器运行时，不动 Xcode —— 交叉编译 x86_64 还要靠它的 SDK。
              sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
              sudo rm -rf /Library/Developer/CoreSimulator/Caches/* || true
              rm -rf ~/Library/Caches/* || true
              ;;
            Windows)
              rm -rf "/c/Program Files/Android" "/c/Program Files (x86)/Android" || true
              ;;
          esac
          echo "::group::清理后"
          df -h
          echo "::endgroup::"

      # 用 runner 镜像自带的 Rust，不 rustup update stable：
      # 编译器每次漂移到「当天最新」，会多出一个与代码毫无关系、且只在发布当天暴露的失败来源。
      - name: 添加交叉目标
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config clang libclang-dev \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$VERSION cargo=$CARGO_VERSION"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag $TAG 与 Cargo.toml 的 $CARGO_VERSION 不一致"
            exit 1
          fi

      # 每一条编译/测试命令都把输出落盘到 ci-output.txt，失败时由收尾步骤带走。
      # pipefail 不能省：没有它，cargo 失败而 tee 成功会让这一步看起来是绿的。
      - name: 构建 release
        shell: bash
        env:
          # 交叉到 x86_64 时，带 C 部分的依赖要靠它选对架构。
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || '' }}
        run: |
          set -o pipefail
          cargo build --release --locked --bin ngy-book-studio \
            --target ${{ matrix.target }} 2>&1 | tee -a ci-output.txt

      # 与本地完全同一条命令：在 workflow 里写只存在于 CI 的打包命令，
      # 那段代码永远不会被本地跑过。
      - name: 打包
        if: success()
        shell: bash
        run: |
          set -o pipefail
          python packaging/package.py --target ${{ matrix.target }} --out dist 2>&1 | tee -a ci-output.txt

      - name: 列出产物
        if: success()
        shell: bash
        run: |
          ls -la dist
          df -h | head -6

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # 用 release profile 跑测试：复用刚构建好的那份 target/release，
      # 不再单独拉一份 debug 产物 —— Windows 上一次就是倒在编译 debug 测试目标上的。
      # 编译与测试拆两步 —— cargo test 返回 101 分不清「编译失败」与「测试失败」。
      - name: 编译测试目标
        if: matrix.test
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --target ${{ matrix.target }} --no-run 2>&1 | tee -a ci-output.txt

      - name: 运行测试
        if: matrix.test
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --locked --target ${{ matrix.target }} --no-fail-fast 2>&1 | tee -a ci-output.txt

      # 手上没有 PAT 时读不到 job 日志（未认证一律 403），所以让 CI 自己把输出交出来：
      # 一份进 check-run 注解（匿名就能读，不用 fetch），一份推到 ci-log 分支（零配额取回）。
      # 这步自己红了会盖住真正失败的那一步，所以 continue-on-error。
      - name: 失败时交出构建输出
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          {
            set -x
            if [ ! -f ci-output.txt ]; then
              echo "没有捕获到输出（失败发生在第一个 tee 之前）"
              exit 0
            fi
            echo "=== 输出行数：$(wc -l < ci-output.txt) ==="
            python - <<'PY' || true
          import pathlib
          text = pathlib.Path("ci-output.txt").read_text(encoding="utf-8", errors="replace")
          # 头尾都留：首个报错常在头部，汇总在尾部。
          excerpt = text[:1500] + "\n...[中略]...\n" + text[-6000:]
          escaped = excerpt.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=构建输出(" + str(len(text)) + "字符)::" + escaped)
          PY
            branch="ci-log/${{ matrix.name }}"
            mkdir -p ci-log
            cp ci-output.txt "ci-log/${{ matrix.name }}.txt"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "${branch}"
            git add -f "ci-log/${{ matrix.name }}.txt"
            git commit -m "ci: 失败输出"
            git push --force origin "${branch}"
          } > push-report.txt 2>&1 || echo "推送失败（原因见 push-report.txt）"
          cat push-report.txt || true

  release:
    name: publish release
    needs: build
    # always()：构建 job 里某个平台失败时也要走到这里。needs 的隐式「必须全绿」会把
    # Release 直接 skip 掉，那样连「为什么没发」都看不见。产物齐全才发，不齐全由
    # 下面的硬校验拦住。
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout：gh 靠 git remote 回答「往哪个仓库发」，
      # 没有 .git 的工作目录只在日志里留一句 exit code 1。
      # 且要放在 download 之前 —— checkout 会清理工作目录，反过来会把刚取回的 dist/ 删掉。
      - uses: actions/checkout@v4

      # 缺 artifact 时别让这一步自己炸掉，留给下面的齐全检查报出到底差几个。
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 产物齐全检查
        run: |
          ls -la dist
          COUNT=$(ls -1 dist | grep -cE '\.(zip|tar\.gz)$' || true)
          echo "产物数量：$COUNT"
          # 少一个就不发：只挂了一半产物的 Release 比没有 Release 更容易误导人。
          if [ "$COUNT" -ne 4 ]; then
            echo "::error::期望 4 个产物，实际 $COUNT"
            exit 1
          fi

      - name: 写 Release 说明
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cat > notes.md <<EOF
          ## 墨页 ${VERSION}

          本地图书库、阅读器与编辑器。导入 EPUB / PDF / DOC / DOCX / PPTX / XLSX / DjVu
          与未加密的 MOBI/AZW/AZW3/KFX，转成统一内容模型后统一编辑，并永久保留每本导入
          图书字节一致的原文件。

          ### 下载

          | 平台 | 文件 |
          | --- | --- |
          | Windows 10/11 (x86_64) | ngy-book-studio-${VERSION}-windows-x86_64.zip |
          | Linux (x86_64) | ngy-book-studio-${VERSION}-linux-x86_64.tar.gz |
          | macOS 12+ (Apple Silicon) | ngy-book-studio-${VERSION}-macos-arm64.zip |
          | macOS 12+ (Intel) | ngy-book-studio-${VERSION}-macos-x86_64.zip |

          ### 平台验证状态（请先读这一条）

          - **Windows 10/11 / MSVC**：唯一完整验收的平台。本次发布在 runner 上跑过全量测试。
          - **Linux x86_64**：只验证了「编得过、打得出来」，**没有跑测试，也没有人运行过界面**。
          - **macOS（arm64 与 x86_64）**：同上，**只验证构建**；x86_64 那一份还是交叉编译出来的。

          在 Linux / macOS 上遇到渲染、字体、WebView 或输入法问题，请当作已知未验证区域来报告。

          ### 首次打开

          - **macOS**：包内的 \`.app\` 只做了 ad-hoc 签名（没有 Developer ID 证书、未经公证）。
            Gatekeeper 会拦住它，请**右键点击 .app →「打开」**，不要双击 —— 这不是包坏了。
          - **Windows**：需要 Microsoft Edge WebView2 Runtime；缺失时应用会询问是否打开下载页。
            CRT 已静态链接，不需要另外安装 VC++ 运行库。
          - **Linux**：便携包里的二进制不在系统 PATH 中，\`.desktop\` 的 \`Exec=\` 假设你已把它放进 PATH。

          ### 许可证

          LICENSE 全文只有一条：**源码公开供阅读，禁止任何形式的封装/再分发。**
          本 Release 的构建产物由作者本人发布；第三方不得再封装或再分发。
          EOF
          cat notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # --draft=false 不是可有可无的：删 tag 重推的那个窗口里 GitHub 会把
            # Release 打回 draft，而 draft 在匿名 API 与 Releases 页面上都看不见。
            # gh 带 token 看得见 draft，于是每一步都「成功」，而外面什么都没有。
            gh release edit "${TAG}" --draft=false --title "${TAG}" --notes-file notes.md
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file notes.md dist/*
          fi

      # 诊断步骤本身不要弄成红的：它红了会盖住真正失败的那一步。
      - name: 匿名校验 Release 真的公开
        continue-on-error: true
        run: |
          STATUS=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          echo "匿名 GET 状态码：$STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::匿名请求看不到这个 Release（$STATUS）—— 很可能还是 draft"
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/release.json").read_text(encoding="utf-8"))
          print("draft:", data.get("draft"), "assets:", len(data.get("assets", [])))
          assert data.get("draft") is False, "Release 仍是 draft"
          assert len(data.get("assets", [])) == 4, "产物数量不是 4"
          PY
